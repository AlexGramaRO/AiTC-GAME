<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>webATC — User Manual</title>
  <link rel="stylesheet" href="/manual/css/manual.css" />
  <style>
    .subscriber-manual-page {
      min-height: 100vh;
      padding: 1.5rem 1.25rem 2.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .subscriber-manual-page h1 {
      margin: 0 0 1rem;
      font-size: 1.35rem;
      color: var(--accent);
    }

    .subscriber-manual-figure {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      overflow: auto;
    }

    .subscriber-manual-image {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <main class="subscriber-manual-page">
    <a class="back-link" href="/">← Back to webATC</a>
    <h1>Aircraft label — quick reference</h1>
    <figure class="subscriber-manual-figure">
      <img
        src="/static/images/DEMO_AiTC_Label.png"
        alt="webATC aircraft label reference: callsign, runway, exit waypoint, aircraft type, destination, speeds, levels, heading, direct-to, rate of climb, exit level, and mouse actions for each field."
        class="subscriber-manual-image"
      />
    </figure>
  </main>
</body>
</html>
